[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "inspection-contour-model"
version = "0.1.0"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["torch>=2.5", "numpy>=1.26", "scipy>=1.12", "shapely>=2", "pillow>=10"]
[project.optional-dependencies]
test = ["pytest>=8"]
bridge = ["opencv-python-headless>=4.8"]
# Torch-free inference of exported models (contour_model.onnx_runtime).
onnx = ["onnxruntime>=1.20"]
export = ["onnx>=1.17", "onnxscript>=0.3", "onnxruntime>=1.20"]
[project.scripts]
contour-model = "contour_model.cli:main"
[tool.hatch.build.targets.wheel]
packages = ["src/contour_model"]
[tool.pytest.ini_options]
pythonpath = ["src", "../../research/synthetic-shapes/src"]
testpaths = ["tests"]
