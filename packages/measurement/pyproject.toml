[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inspection-measurement"
version = "0.1.0"
description = "Non-ML contour metrology in pixel coordinates"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["numpy>=1.26", "scipy>=1.12", "pillow>=10", "shapely>=2.0"]

[project.optional-dependencies]
image = ["inspection-edge-model[onnx]", "inspection-pae"]
test = ["pytest>=8"]

[project.scripts]
inspection-measure = "inspection_measurement.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/inspection_measurement"]

[tool.pytest.ini_options]
pythonpath = ["src", "benchmarks", "../edge-model", "../pae/src", "../../research/synthetic-shapes/src"]
testpaths = ["tests"]
