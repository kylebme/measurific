[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inspection-edge-model"
version = "0.1.0"
description = "Learned sub-pixel silhouette edges for backlit inspection"
requires-python = ">=3.11"
license = {text = "MIT"}
# Torch-free inference of the exported model (edgesr.runtime). Training, torch inference
# (edgesr.predict) and export use requirements.txt instead.
dependencies = ["numpy>=1.26", "scipy>=1.12", "shapely>=2", "opencv-python-headless>=4.8", "pillow>=10"]

[project.optional-dependencies]
onnx = ["onnxruntime>=1.20"]
export = ["torch>=2.5", "onnx>=1.17", "onnxscript>=0.3", "onnxruntime>=1.20"]

[tool.hatch.build.targets.wheel]
packages = ["edgesr"]
