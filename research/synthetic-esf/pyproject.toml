[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "telecentric-synthetic"
version = "0.2.0"
description = "Reproducible telecentric silhouette rendering for subpixel metrology"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["numpy>=1.26", "scipy>=1.12", "trimesh>=4.0", "rtree>=1.2", "shapely>=2.0", "pillow>=10"]

[project.optional-dependencies]
fast = ["embreex>=2.17"]
test = ["pytest>=8"]

[project.scripts]
telecentric = "telecentric.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/telecentric"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
