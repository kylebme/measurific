[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inspection-shapes"
version = "0.1.0"
description = "Contour-first synthetic silhouette semantic segmentation datasets"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["numpy>=1.26", "scipy>=1.12", "shapely>=2.0", "pillow>=10"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
inspection-shapes = "inspection_shapes.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/inspection_shapes"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
